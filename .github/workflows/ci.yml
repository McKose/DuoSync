name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint · Typecheck · DB/RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db

  functions:
    name: Edge Functions (deno check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai-court-verdict/index.ts supabase/functions/send-push-notification/index.ts
      - run: deno test supabase/functions/_shared
