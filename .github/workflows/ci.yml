name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint · Typecheck · DB/RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db

  functions:
    name: Edge Functions (deno check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Run from supabase/functions so its deno.json (nodeModulesDir: none)
      # applies instead of the Expo package.json at the repo root.
      - run: deno check ai-court-verdict/index.ts send-push-notification/index.ts
        working-directory: supabase/functions
      - run: deno test _shared
        working-directory: supabase/functions
